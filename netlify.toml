[build]
  command = "npm run build"
  publish = "out"

# Serverless functions deploy alongside the static site. `submission-created`
# is a reserved name Netlify triggers on every verified form submission.
[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/proform"
  to = "https://velo-pro-form-ai.base44.app/"
  status = 301
  force = true
